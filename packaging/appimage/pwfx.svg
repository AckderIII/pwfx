<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- The app's own palette: theme.slint's bg-raised, line and accent. -->
  <rect x="8" y="8" width="240" height="240" rx="44" fill="#1c1f27" stroke="#333949" stroke-width="4"/>
  <!-- three filter stages in a chain: a fader each, at different settings -->
  <g stroke="#333949" stroke-width="10" stroke-linecap="round">
    <line x1="72" y1="60" x2="72" y2="196"/>
    <line x1="128" y1="60" x2="128" y2="196"/>
    <line x1="184" y1="60" x2="184" y2="196"/>
  </g>
  <g stroke="#5b9dff" stroke-width="10" stroke-linecap="round">
    <line x1="72" y1="120" x2="72" y2="196"/>
    <line x1="128" y1="88" x2="128" y2="196"/>
    <line x1="184" y1="148" x2="184" y2="196"/>
  </g>
  <g fill="#e6e9f0">
    <circle cx="72" cy="120" r="16"/>
    <circle cx="128" cy="88" r="16"/>
    <circle cx="184" cy="148" r="16"/>
  </g>
</svg>
