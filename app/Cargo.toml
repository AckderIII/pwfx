[package]
name    = "pwfx"
version = "0.2.0"
edition = "2021"
description = "Filter-chain patchbay for the pw_* PipeWire filter nodes"

[dependencies]
pipewire   = "0.10"
libspa     = "0.10"
slint      = "1.18"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
libc       = "0.2"

# Only here to flip a transitive feature: slint reaches fontconfig through
# fontique, whose default path wants fontconfig.pc at build time. Loading
# libfontconfig at runtime instead keeps the build free of system -devel
# packages. Nothing in this crate calls fontique.
fontique   = { version = "0.11", features = ["fontconfig-dlopen"] }

[build-dependencies]
slint-build = "1.18"

[profile.release]
opt-level = 2

[dev-dependencies]
i-slint-backend-testing = "1.18"
